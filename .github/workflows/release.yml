name: Release

on:
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for version tag extraction

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Run linting
        run: npm run lint

      - name: Run type checking
        run: npm run typecheck

      - name: Create release package
        uses: rayners/foundry-module-actions/release@v6
        with:
          node-version: '22'
          build-command: 'npm run build'
          working-directory: 'dist'
          module-files: 'module.js module.json styles/ languages/ README.md README_FOUNDRY.md CHANGELOG.md LICENSE'

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Update release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Extract the section for this version from CHANGELOG.md
          awk "/^## \\[${VERSION}\\]/{found=1; next} /^## \\[|^---/{if(found) exit} found{print}" CHANGELOG.md > /tmp/release-notes.md
          gh release edit "${{ github.event.release.tag_name }}" --notes-file /tmp/release-notes.md

      - name: Notify Foundry Package Registry
        uses: rayners/foundry-module-actions/foundry-release@v6
        with:
          package-id: 'banelands'
          release-token: ${{ secrets.FOUNDRY_RELEASE_TOKEN }}
          version: ${{ steps.version.outputs.version }}
          manifest-url: 'https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/module.json'
          notes-url: 'https://github.com/${{ github.repository }}/releases/tag/${{ github.event.release.tag_name }}'
          minimum-foundry-version: '13'
          verified-foundry-version: '13'
