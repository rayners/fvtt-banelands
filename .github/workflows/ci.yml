name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run CI Pipeline
        uses: rayners/foundry-module-actions/ci@v6
        with:
          node-version: '22'
          junit-output: true
